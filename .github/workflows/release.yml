name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'

      - name: Generate dummy keystore (CI verification only)
        run: |
          keytool -genkey -v \
            -keystore android/app/keeauth-release.keystore \
            -alias keeauth \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CI Build, OU=CI, O=KeeAuth, L=Unknown, S=Unknown, C=US" \
            -noprompt
          cat > android/key.properties << EOF
          storePassword=android
          keyPassword=android
          keyAlias=keeauth
          storeFile=keeauth-release.keystore
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Generate SHA1
        run: sha1sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha1

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha1
