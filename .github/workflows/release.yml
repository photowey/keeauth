name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # v1.0.0, v1.0.0-rc1, v1.0.0+1

jobs:
  # ---------------------------------------------------------------------------
  # Android — verify release build + upload unsigned artifacts
  # Signed with a CI-only dummy keystore. Production signing is done locally.
  # ---------------------------------------------------------------------------
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate dummy keystore (CI verification only)
        run: |
          keytool -genkey -v \
            -keystore android/keeauth-release.keystore \
            -alias keeauth \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CI Build, OU=CI, O=KeeAuth, L=Unknown, S=Unknown, C=US" \
            -noprompt
          cat > android/key.properties << EOF
          storePassword=android
          keyPassword=android
          keyAlias=keeauth
          storeFile=keeauth-release.keystore
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # ---------------------------------------------------------------------------
  # iOS — verify release build (unsigned)
  # Code signing is done locally with Xcode / fastlane.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build IPA (unsigned — for verification)
        run: flutter build ipa --release --no-codesign

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/*.ipa
