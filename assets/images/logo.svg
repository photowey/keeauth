<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1A237E;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#4527A0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#006064;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#448AFF;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#7C4DFF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#18FFFF;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#448AFF;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#18FFFF;stop-opacity:0.2" />
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="softGlow">
            <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <clipPath id="circleClip">
            <circle cx="200" cy="200" r="130"/>
        </clipPath>
    </defs>

    <g transform="translate(-70,-70)">
        <g clip-path="url(#circleClip)">
            <rect width="400" height="400" fill="url(#bgGrad)" rx="20"/>

            <g transform="translate(200, 200)" filter="url(#glow)">

                <circle cx="0" cy="0" r="120" fill="none" stroke="url(#mainGrad)" stroke-width="16" stroke-linecap="round"/>

                <g transform="translate(0, -120)">
                    <circle cx="0" cy="0" r="8" fill="#448AFF"/>
                    <circle cx="0" cy="0" r="8" fill="white" opacity="0.2"/>
                </g>
                <g transform="rotate(120) translate(0, -120)">
                    <circle cx="0" cy="0" r="8" fill="#7C4DFF"/>
                    <circle cx="0" cy="0" r="8" fill="white" opacity="0.2"/>
                </g>
                <g transform="rotate(240) translate(0, -120)">
                    <circle cx="0" cy="0" r="8" fill="#18FFFF"/>
                    <circle cx="0" cy="0" r="8" fill="white" opacity="0.2"/>
                </g>

                <g font-family="monospace" font-size="5" fill="white" opacity="0.4">
                    <text x="-65" y="-55">0</text>
                    <text x="-58" y="-48">1</text>
                    <text x="-70" y="-42">1</text>
                    <text x="-62" y="-35">0</text>
                    <text x="55" y="-58">1</text>
                    <text x="62" y="-52">0</text>
                    <text x="52" y="-45">0</text>
                    <text x="68" y="-38">1</text>
                    <text x="-60" y="45">1</text>
                    <text x="-68" y="52">0</text>
                    <text x="-55" y="58">1</text>
                    <text x="58" y="48">0</text>
                    <text x="65" y="55">1</text>
                    <text x="52" y="62">0</text>
                </g>

                <g transform="translate(60, -103.9)">
                    <circle cx="0" cy="0" r="9" fill="url(#keyGrad)" stroke="white" stroke-width="1.2" opacity="0.8"/>
                    <text x="0" y="2.5" font-family="monospace" font-size="7" fill="white" text-anchor="middle" font-weight="bold">.dt</text>
                </g>

                <g opacity="0.7">
                    <g transform="translate(-55, -50)">
                        <path d="M 0 -6 L 0 6 M -6 0 L 6 0" stroke="#448AFF" stroke-width="1"/>
                        <circle cx="0" cy="0" r="1.5" fill="white"/>
                    </g>
                    <g transform="translate(60, -58)">
                        <path d="M 0 -5 L 0 5 M -5 0 L 5 0" stroke="#7C4DFF" stroke-width="1"/>
                        <circle cx="0" cy="0" r="1.2" fill="white"/>
                    </g>
                    <g transform="translate(-58, 55)">
                        <path d="M 0 -5 L 0 5 M -5 0 L 5 0" stroke="#18FFFF" stroke-width="1"/>
                        <circle cx="0" cy="0" r="1.2" fill="white"/>
                    </g>
                    <g transform="translate(55, 52)">
                        <path d="M 0 -4 L 0 4 M -4 0 L 4 0" stroke="#69F0AE" stroke-width="1"/>
                        <circle cx="0" cy="0" r="1" fill="white"/>
                    </g>
                    <circle cx="-45" cy="-35" r="0.8" fill="#448AFF" opacity="0.6"/>
                    <circle cx="48" cy="-42" r="0.6" fill="#7C4DFF" opacity="0.5"/>
                    <circle cx="-50" cy="40" r="0.7" fill="#18FFFF" opacity="0.6"/>
                    <circle cx="42" cy="45" r="0.5" fill="white" opacity="0.4"/>
                </g>
            </g>

            <g transform="translate(200, 200)">
                <text x="0" y="16" font-family="sans-serif" font-size="48" font-weight="800"
                    fill="none" stroke="white" stroke-width="2" stroke-opacity="0.4"
                    text-anchor="middle" filter="url(#softGlow)">kee</text>
                <text x="0" y="16" font-family="sans-serif" font-size="48" font-weight="800"
                    fill="url(#mainGrad)" text-anchor="middle">kee</text>
            </g>
        </g>
    </g>
</svg>
